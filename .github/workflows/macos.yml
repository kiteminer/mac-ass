name: macOS
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: swift test
      - name: Build app
        run: bash scripts/build.sh
      - name: Launch smoke test
        run: |
          open -n build/MacAss.app
          sleep 5
          pgrep -x MacAss
          pkill -x MacAss
      - name: Package
        run: ditto -c -k --keepParent build/MacAss.app build/MacAss.zip
      - uses: actions/upload-artifact@v4
        with:
          name: MacAss-macOS
          path: build/MacAss.zip
